name: live
on:
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    steps:
      - name: boot redroid
        run: |
          set +e
          sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" android-tools-adb xz-utils
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || sudo modprobe binder_linux
          docker run -itd --privileged --name redroid -p 5555:5555 redroid/redroid:13.0.0-latest
          adb connect 127.0.0.1:5555
          for i in $(seq 1 30); do [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null|tr -d '\r')" = "1" ] && break; sleep 4; done
          adb -s 127.0.0.1:5555 root; sleep 3; adb connect 127.0.0.1:5555
          echo "BOOT_OK abi=$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi)"
      - name: tunel bore (adb) PRIMERO
        run: |
          set +e
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-aarch64-unknown-linux-musl.tar.gz | tar xz; chmod +x bore
          nohup ./bore local 5555 --to bore.pub > /tmp/bore.log 2>&1 &
          sleep 8
          echo "####ENDPOINT####"; grep -aoE "bore.pub:[0-9]+" /tmp/bore.log | head -1; echo "####END####"
          cat /tmp/bore.log | tail -3
      - name: frida + app (en paralelo, no bloquea el tunel)
        env:
          GH_TOKEN: ${{ secrets.APK_PAT }}
        run: |
          set +e
          timeout 60 bash -c 'curl -sL -o fs.xz https://github.com/frida/frida/releases/download/16.7.19/frida-server-16.7.19-android-arm64.xz; xz -d fs.xz'
          adb -s 127.0.0.1:5555 push fs /data/local/tmp/frida-server; adb -s 127.0.0.1:5555 shell chmod 755 /data/local/tmp/frida-server
          adb -s 127.0.0.1:5555 shell "nohup /data/local/tmp/frida-server >/dev/null 2>&1 &"
          gh release download apk218 -R dani811/dreame-camera-bridge -D apk
          timeout 180 adb -s 127.0.0.1:5555 install-multiple -r -d apk/base.apk apk/split_config.arm64_v8a.apk apk/split_config.xxhdpi.apk
          echo "APP_READY $(adb -s 127.0.0.1:5555 shell pm path com.dreame.smartlife 2>/dev/null | head -1)"
      - name: keep alive
        run: |
          set +e
          for n in $(seq 1 60); do sleep 300; docker exec redroid true 2>/dev/null || break; done
