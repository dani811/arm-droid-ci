name: capture
on:
  workflow_dispatch: {}
jobs:
  cap:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: infra (binder+redroid+adb)
        run: |
          set +e
          sudo apt-get update -q
          sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" android-tools-adb xz-utils python3-pip >/dev/null 2>&1
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || sudo modprobe binder_linux
          docker run -itd --privileged --name redroid -p 5555:5555 redroid/redroid:13.0.0-latest
          sudo apt-get install -y -q android-tools-adb
          adb connect 127.0.0.1:5555
          for i in $(seq 1 30); do b=$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); [ "$b" = "1" ] && break; sleep 5; done
          echo "abi=$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi)"
      - name: root + frida-server
        run: |
          set +e
          adb -s 127.0.0.1:5555 root; sleep 3; adb connect 127.0.0.1:5555
          echo "id=$(adb -s 127.0.0.1:5555 shell id)"
          curl -sL -o fs.xz https://github.com/frida/frida/releases/download/16.7.19/frida-server-16.7.19-android-arm64.xz
          xz -d fs.xz
          adb -s 127.0.0.1:5555 push fs /data/local/tmp/frida-server
          adb -s 127.0.0.1:5555 shell chmod 755 /data/local/tmp/frida-server
          adb -s 127.0.0.1:5555 shell "nohup /data/local/tmp/frida-server >/dev/null 2>&1 &"
          sleep 4; adb -s 127.0.0.1:5555 shell "ps -A | grep frida-server | head -1"
          adb -s 127.0.0.1:5555 forward tcp:27042 tcp:27042
      - name: download apk (private) + install
        env:
          GH_TOKEN: ${{ secrets.APK_PAT }}
        run: |
          set +e
          gh release download apk218 -R dani811/dreame-camera-bridge -D apk
          ls -la apk
          adb -s 127.0.0.1:5555 install-multiple -r -d apk/base.apk apk/split_config.arm64_v8a.apk apk/split_config.xxhdpi.apk
          adb -s 127.0.0.1:5555 shell dumpsys package com.dreame.smartlife | grep -m1 versionName
      - name: spawn + login nav + capture
        run: |
          set +e
          pip3 install -q "frida==16.7.19"
          python3 driver.py 90 > /tmp/driver.log 2>&1 &
          DPID=$!
          sleep 16
          bash login.sh
          sleep 10
          wait $DPID 2>/dev/null
          echo "=== driver.log ==="; sed -E 's/: .*/: [oculto]/' /tmp/driver.log | tail -20
      - name: screenshot login
        if: always()
        run: |
          set +e
          sleep 8
          adb -s 127.0.0.1:5555 exec-out screencap -p > /tmp/screen.png
          ls -la /tmp/screen.png
      - name: diag (logcat+maps+activity)
        if: always()
        run: |
          set +e
          PID=$(adb -s 127.0.0.1:5555 shell pidof com.dreame.smartlife | tr -d '\r')
          echo "pid=$PID"
          echo "iotcommon loaded? $(adb -s 127.0.0.1:5555 shell cat /proc/$PID/maps 2>/dev/null | grep -c iotcommon)"
          adb -s 127.0.0.1:5555 shell dumpsys activity activities 2>/dev/null | grep -oE "com.dreame.smartlife/[^ }]*" | head -1
          adb -s 127.0.0.1:5555 logcat -d 2>/dev/null | grep -aiE "dreame|emdmjgm|FATAL|frida|qemu|emulator|UnsatisfiedLink|SecurityException|abort|MyJni|outs_size|detect" | tail -60 > /tmp/logcat.txt
          echo "=== logcat (saneado) ==="; sed -E 's/[A-Za-z0-9+/]{20,}/<b64>/g' /tmp/logcat.txt | tail -50
      - name: redroid logs on fail
        if: failure()
        run: docker logs redroid 2>&1 | tail -40
      - name: exfil all (privado)
        if: always()
        env: { GH_TOKEN: "${{ secrets.APK_PAT }}" }
        run: |
          set +e
          gh release view cap-out -R dani811/dreame-camera-bridge >/dev/null 2>&1 || gh release create cap-out -R dani811/dreame-camera-bridge --title cap-out --notes "captura CI"
          for f in /tmp/capture.txt /tmp/logcat.txt /tmp/screen.png /tmp/screen_*.png; do [ -f "$f" ] && gh release upload cap-out -R dani811/dreame-camera-bridge "$f" --clobber; done
          echo "subidos a cap-out"
