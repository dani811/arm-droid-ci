name: arm-probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: host info
        run: |
          uname -a; echo "nproc=$(nproc)"; free -h || true
          grep -m1 'model name\|CPU part' /proc/cpuinfo || true
      - name: load binder module
        run: |
          set +e
          sudo apt-get update -q
          sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" || echo "no modules-extra pkg"
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || sudo modprobe binder_linux
          echo "lsmod:"; lsmod | grep -i binder || echo "binder NOT loaded"
          ls -l /dev/binder* /dev/*binder* 2>&1 || true
      - name: start redroid (arm64)
        run: |
          set +e
          docker run -itd --privileged --name redroid -p 5555:5555 redroid/redroid:13.0.0-latest || true
          sleep 20; docker ps -a
          echo "=== redroid logs ==="; docker logs redroid 2>&1 | tail -40
      - name: adb connect + boot
        run: |
          set +e
          sudo apt-get install -y -q android-tools-adb
          adb connect 127.0.0.1:5555
          for i in $(seq 1 24); do b=$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); echo "t=$((i*5))s boot=$b"; [ "$b" = "1" ] && break; sleep 5; done
          echo "abi: $(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi 2>/dev/null)"
          echo "id:  $(adb -s 127.0.0.1:5555 shell id 2>/dev/null)"
