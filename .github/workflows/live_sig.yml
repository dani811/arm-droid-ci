name: live_sig
on: { workflow_dispatch: {} }
jobs:
  live:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: redroid + login + abrir directo + capturar canal de senalizacion
        env:
          GH_TOKEN: ${{ secrets.APK_PAT }}
          DH_USER: ${{ secrets.DH_USER }}
          DH_PASS: ${{ secrets.DH_PASS }}
        run: |
          set +e
          echo "" | base64 -d > pub.pem
          sudo apt-get update -q || true
          for t in 1 2 3; do sudo apt-get install -y -q android-tools-adb xz-utils && command -v adb && break; sleep 6; done
          sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" || true
          command -v adb >/dev/null || { echo FATAL no adb; exit 1; }
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || sudo modprobe binder_linux
          docker run -itd --privileged --name redroid -p 5555:5555 redroid/redroid:13.0.0-latest androidboot.locale=es-ES androidboot.timezone=Europe/Madrid
          A="adb -s 127.0.0.1:5555"
          adb connect 127.0.0.1:5555
          for i in $(seq 1 40); do [ "$($A shell getprop sys.boot_completed 2>/dev/null|tr -d '\r')" = "1" ] && break; sleep 4; done
          $A root; sleep 3; adb connect 127.0.0.1:5555
          $A shell "setprop persist.sys.locale es-ES; setprop persist.sys.country ES"
          $A shell "settings put system system_locales es-ES"
          $A shell "su 0 stop; sleep 2; su 0 start"
          for i in $(seq 1 40); do [ "$($A shell getprop sys.boot_completed 2>/dev/null|tr -d '\r')" = "1" ] && break; sleep 4; done
          sleep 5
          gh release download apk218 -R dani811/dreame-camera-bridge -D apk
          timeout 180 $A install-multiple -r -d apk/base.apk apk/split_config.arm64_v8a.apk apk/split_config.xxhdpi.apk
          $A shell pm clear com.dreame.smartlife
          # logcat desde ANTES de lanzar (captura todo el arranque + conexion aep/itls + senalizacion)
          $A logcat -b all -c
          ( $A logcat -b all -v time > /tmp/logcat.txt 2>&1 ) &
          LOGPID=$!
          $A shell am start -n com.dreame.smartlife/com.dreame.smartlife.ui.activity.SplashActivity
          sleep 12
          bash login.sh || true
          sleep 20
          # abrir el directo: volcar arbol UI y tocar la tarjeta del L40, luego posible boton de camara/play
          $A shell "uiautomator dump /sdcard/ui1.xml" 2>/dev/null; $A pull /sdcard/ui1.xml /tmp/ui1.xml 2>/dev/null
          # tocar la tarjeta del device (parsea bounds del nodo con texto L40/Ultra; si no, centro)
          XY=$(python3 - /tmp/ui1.xml <<'PY'
import re,sys
try: t=open(sys.argv[1]).read()
except: t=""
m=None
for node in re.findall(r'<node[^>]*>',t):
    tx=re.search(r'text="([^"]*)"',node)
    if tx and re.search(r'(L40|Ultra|AE|vacuum|robot)',tx.group(1),re.I):
        b=re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',node)
        if b: x1,y1,x2,y2=map(int,b.groups()); m=((x1+x2)//2,(y1+y2)//2); break
print(f"{m[0]} {m[1]}" if m else "360 430")
PY
)
          echo "tap device card -> $XY"; $A shell input tap $XY; sleep 10
          $A shell "uiautomator dump /sdcard/ui2.xml" 2>/dev/null; $A pull /sdcard/ui2.xml /tmp/ui2.xml 2>/dev/null
          # tocar un boton de camara/directo/ver
          XY2=$(python3 - /tmp/ui2.xml <<'PY'
import re,sys
try: t=open(sys.argv[1]).read()
except: t=""
m=None
for node in re.findall(r'<node[^>]*>',t):
    tx=re.search(r'text="([^"]*)"',node)
    if tx and re.search(r'(c\xe1mara|camara|camera|monitor|directo|ver v|video|v\xeddeo|vigil|live)',tx.group(1),re.I):
        b=re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',node)
        if b: x1,y1,x2,y2=map(int,b.groups()); m=((x1+x2)//2,(y1+y2)//2); break
print(f"{m[0]} {m[1]}" if m else "")
PY
)
          [ -n "$XY2" ] && { echo "tap camera -> $XY2"; $A shell input tap $XY2; sleep 8; } || echo "no camera btn found"
          $A shell "uiautomator dump /sdcard/ui3.xml" 2>/dev/null; $A pull /sdcard/ui3.xml /tmp/ui3.xml 2>/dev/null
          echo "esperando senalizacion P2P ~25s..."
          sleep 25
          kill $LOGPID 2>/dev/null
          # heap durante/tras el intento
          PID=$($A shell "su 0 pidof com.dreame.smartlife" | tr -d '\r' | awk '{print $1}')
          $A shell "su 0 am dumpheap $PID /data/local/tmp/h.hprof"; sleep 8
          $A shell "su 0 chmod 666 /data/local/tmp/h.hprof" 2>/dev/null
          adb connect 127.0.0.1:5555 >/dev/null 2>&1
          $A pull /data/local/tmp/h.hprof /tmp/h.hprof 2>&1 | tail -1
          # --- construir loot: lineas de logcat del canal de senalizacion ---
          : > loot.txt
          echo "===== LOGCAT SENALIZACION =====" >> loot.txt
          grep -aiE 'itls|mqtt|wss|websocket|signal|iotx-vision|vision/p2p|offer|answer|candidate|StartP2P|rtc|/sys/|app/up|app/down|connect\(\)|mqttHost|publish|subscribe|topic|peerconn|lvmedia|LVLive|aep|linksdk|cmp' /tmp/logcat.txt 2>/dev/null | grep -aivE 'password|accessToken' | head -400 >> loot.txt
          echo "===== UI TREE (texto + bounds, para mapear) =====" >> loot.txt
          for f in /tmp/ui1.xml /tmp/ui2.xml /tmp/ui3.xml; do echo "--- $f ---" >> loot.txt; tr '>' '\n' < "$f" 2>/dev/null | grep -aE 'text="[^"]{1,40}"|clickable="true"' | grep -aoE 'text="[^"]*"|class="[^"]*"|bounds="\[[0-9,]+\]\[[0-9,]+\]"' | paste -sd' ' - | tr ';' '\n' 2>/dev/null | head -200 >> loot.txt; done
          echo "===== intento camara (XY device=$XY camera=$XY2) =====" >> loot.txt
          echo "===== HEAP: topics/senalizacion =====" >> loot.txt
          grep -aoE '/(sys|ext)/[A-Za-z0-9_]+/[A-Za-z0-9_]+/[A-Za-z0-9/_{}.-]{3,60}' /tmp/h.hprof 2>/dev/null | sort -u | head -80 >> loot.txt
          grep -aoE '(iotx-vision[a-z/-]*|offerSdp|answerSdp|/vision/[a-z/]+|StartP2PStreaming)' /tmp/h.hprof 2>/dev/null | sort -u | head -40 >> loot.txt
          echo "loot=$(wc -c < loot.txt)B  logcat=$(wc -l < /tmp/logcat.txt)L"
          openssl rand -hex 32 > aeskey.hex
          openssl enc -aes-256-cbc -pbkdf2 -pass file:aeskey.hex -in loot.txt -out loot.enc
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in aeskey.hex -out key.enc
          gh release view cap-out -R dani811/dreame-camera-bridge >/dev/null 2>&1 || gh release create cap-out -R dani811/dreame-camera-bridge --title cap-out --notes x
          gh release upload cap-out -R dani811/dreame-camera-bridge loot.enc key.enc --clobber
          echo "SUBIDO loot.enc + key.enc"
