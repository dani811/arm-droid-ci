name: gadget_loot
# Gadget en MODO SCRIPT (sin socket) + camuflado (libc_shared_ext.so). El gadget carga
# h.js DENTRO de cada proceso (incluido el de libitls) sin attach ni puerto -> ataca los
# dos vectores de deteccion anti-frida (socket 27042 + nombre "frida"). El hook escribe el
# CONNECT a un fichero de la app. Login por coords. Exfil hibrido RSA. Sin directo.
on: { workflow_dispatch: { inputs: { capture_secs: { description: "ventana (s)", default: "150" } } } }
jobs:
  loot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: redroid + APK gadget script-mode + login + loot
        env:
          GH_TOKEN: ${{ secrets.APK_PAT }}
          DH_USER:  ${{ secrets.DH_USER }}
          DH_PASS:  ${{ secrets.DH_PASS }}
          CAP_SECS: ${{ inputs.capture_secs }}
        run: |
          set +e
          echo "" | base64 -d > pub.pem
          A="adb -s 127.0.0.1:5555"
          sudo apt-get update -q || true
          sudo apt-get install -y -q android-tools-adb openssl || true
          sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" || true
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || sudo modprobe binder_linux
          docker run -itd --privileged --name redroid -p 5555:5555 redroid/redroid:13.0.0-latest androidboot.locale=es-ES androidboot.timezone=Europe/Madrid
          adb connect 127.0.0.1:5555
          for i in $(seq 1 48); do [ "$($A shell getprop sys.boot_completed 2>/dev/null|tr -d '\r')" = "1" ] && break; sleep 4; done
          $A root; sleep 3; adb connect 127.0.0.1:5555
          $A shell "su 0 setenforce 0" 2>/dev/null
          gh release download apk218-gadget -R dani811/dreame-camera-bridge -D apk
          timeout 200 $A install-multiple -r -d apk/base-signed.apk apk/split_config.arm64_v8a-signed.apk apk/split_config.xxhdpi-signed.apk; echo "install rc=$?"
          [ -z "$($A shell pm path com.dreame.smartlife 2>/dev/null|tr -d '\r')" ] && { echo "FATAL install"; $A exec-out logcat -d|tail -20; docker stop redroid; exit 0; }
          # empujar el script del gadget ANTES de lanzar (el gadget lo lee al cargar)
          $A push hook_triple_gadget.js /data/local/tmp/h.js >/dev/null 2>&1; $A shell chmod 666 /data/local/tmp/h.js
          $A shell am start -n com.dreame.smartlife/com.dreame.smartlife.ui.activity.SplashActivity
          APID=""; for i in $(seq 1 25); do APID=$($A shell pidof com.dreame.smartlife 2>/dev/null|tr -d '\r'); [ -n "$APID" ] && break; sleep 2; done
          echo "app PID=$APID"; sleep 10
          echo "FSTUB/LOOT en logcat: $($A exec-out logcat -d 2>/dev/null | grep -aE 'FSTUB|\[LOOT\]' | tail -5)"
          bash login.sh || true
          echo "login hecho; ventana itls..."
          sleep "$CAP_SECS"
          LPID=$($A shell pidof com.dreame.smartlife 2>/dev/null|tr -d '\r'|awk '{print $1}')
          echo "PID final=$LPID (inicial $APID) -> $([ -n "$LPID" ] && [ "$LPID" = "$APID" ] && echo 'MISMO=gadget sobrevivio' || echo 'CAMBIO/muerto=anti-frida')"
          echo "libitls_mapeado=$($A shell "cat /proc/$LPID/maps 2>/dev/null"|grep -c libitls)"
          echo "=== logcat [LOOT] (solo nombres) ==="; $A exec-out logcat -d 2>/dev/null | grep -aE '\[LOOT\]|ext dlopen|FSTUB' | tail -25
          # recuperar el fichero secreto que escribio el hook
          $A shell "su 0 cat /data/data/com.dreame.smartlife/files/triple.txt 2>/dev/null" > /tmp/triple_raw.txt
          if [ -s /tmp/triple_raw.txt ]; then
            echo "campos:"; cut -d= -f1 /tmp/triple_raw.txt | sort -u
            echo "connect_hits: clientId=$(grep -c '^mqtt_clientId=' /tmp/triple_raw.txt) username=$(grep -c '^mqtt_username=' /tmp/triple_raw.txt) password=$(grep -c '^mqtt_password=' /tmp/triple_raw.txt); itls_frames w=$(grep -c '^itls_w_hex=' /tmp/triple_raw.txt) r=$(grep -c '^itls_r_hex=' /tmp/triple_raw.txt)"
            openssl rand -hex 32 > aeskey.hex
            openssl enc -aes-256-cbc -pbkdf2 -pass file:aeskey.hex -in /tmp/triple_raw.txt -out loot_triple.enc
            openssl pkeyutl -encrypt -pubin -inkey pub.pem -in aeskey.hex -out key_triple.enc
            gh release view cap-out -R dani811/dreame-camera-bridge >/dev/null 2>&1 || gh release create cap-out -R dani811/dreame-camera-bridge --title cap-out --notes x
            gh release upload cap-out -R dani811/dreame-camera-bridge loot_triple.enc key_triple.enc --clobber
            echo "SUBIDO loot cifrado"
          else echo "SIN CAPTURA (fichero vacio)"; fi
          rm -f /tmp/triple_raw.txt aeskey.hex
          docker stop redroid >/dev/null 2>&1; echo FIN; exit 0
